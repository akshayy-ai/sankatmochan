services:
  app:
    build: .
    image: sankatmochan:latest
    container_name: sankatmochan
    restart: unless-stopped
    # Secrets stay in .env.local on the host and are read at container start.
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      PORT: "3000"
    # Published on loopback only — the tunnel is the sole public path in.
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - sankatnet

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: sankatmochan-tunnel
    restart: unless-stopped
    # Named tunnel. A quick tunnel will NOT work here: Telegram refuses
    # *.trycloudflare.com webhook targets ("Failed to resolve host"), so the
    # deployment needs a real hostname on a domain you control.
    # Route it in the Cloudflare dashboard: Public Hostname → http://app:3000
    #
    # The token comes from TUNNEL_TOKEN in the container environment, which
    # cloudflared reads natively. Passing it as `--token ${VAR}` would not
    # work: Compose interpolates command strings from .env at parse time,
    # not from env_file, so the flag would expand to an empty value.
    command: tunnel --no-autoupdate run
    env_file:
      - .env.tunnel
    depends_on:
      - app
    networks:
      - sankatnet

  registrar:
    image: curlimages/curl:latest
    container_name: sankatmochan-registrar
    restart: on-failure:3
    depends_on:
      - tunnel
    env_file:
      - .env.tunnel
    # Re-points the Telegram webhook at PUBLIC_URL on every start, so a
    # redeploy or reboot never leaves the bot registered to a stale target.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if [ -z "$${PUBLIC_URL:-}" ]; then
          echo "PUBLIC_URL not set in .env.tunnel — skipping webhook registration"
          exit 0
        fi

        echo "waiting for app..."
        for i in $$(seq 1 60); do
          curl -fsS -o /dev/null http://app:3000/ && break
          sleep 3
        done

        echo "waiting for tunnel to route $${PUBLIC_URL}..."
        for i in $$(seq 1 60); do
          curl -fsS -o /dev/null --max-time 10 "$${PUBLIC_URL}/" && break
          sleep 5
        done

        echo "registering telegram webhook..."
        curl -fsS --max-time 30 "http://app:3000/api/telegram/setup?url=$${PUBLIC_URL}" || \
          echo "WARNING: webhook registration failed"
        echo
        echo "=================================================="
        echo " SANKATMOCHAN LIVE:   $${PUBLIC_URL}"
        echo " Vobiz Answer URL:    $${PUBLIC_URL}/api/vobiz/answer"
        echo "=================================================="
    networks:
      - sankatnet

networks:
  sankatnet:
    driver: bridge
